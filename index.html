<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ResQra — Firebase Animal Rescue</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Leaflet (for India geotagging map) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDKs (Compat versions for easier integration) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>
  <div class="phone-frame" id="appContainer">
    <div id="screenContainer" class="screen-container">
      <!-- Dynamic content -->
    </div>

    <div id="bottomNav" class="bottom-nav hidden">
      <button class="nav-item" data-screen="home"><i class="fas fa-home"></i><span>Home</span></button>
      <button class="nav-item" data-screen="rescues"><i class="fas fa-map-marker-alt"></i><span>Rescues</span></button>
      <button class="nav-item" data-screen="report"><span class="nav-report"><i class="fas fa-plus"></i></span><span style="font-size:0; visibility:hidden;">Report</span></button>
      <button class="nav-item" data-screen="volunteer"><i class="fas fa-hand-holding-heart"></i><span>Volunteer</span></button>
      <button class="nav-item" data-screen="profile"><i class="fas fa-user"></i><span>Profile</span></button>
    </div>
  </div>

  <!-- App scripts: order matters (config -> state -> auth/data -> map/team -> ui -> navigation -> app bootstrap) -->
  <script src="js/firebase-config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/rescues.js"></script>
  <script src="js/map.js"></script>
  <script src="js/team.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
